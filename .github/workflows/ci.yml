name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-${{ github.ref }}
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VITE_JAZZ_APP_ID: ${{ secrets.VITE_JAZZ_APP_ID }}
      VITE_JAZZ_SERVER_URL: ${{ secrets.VITE_JAZZ_SERVER_URL }}
      JAZZ_ADMIN_SECRET: ${{ secrets.JAZZ_ADMIN_SECRET }}
      BACKEND_SECRET: ${{ secrets.BACKEND_SECRET }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Vercel CLI
        run: npm install --global vercel@54.9.1
      - name: Link the notes project
        run: vercel link --yes --non-interactive --team nnassrulls-projects --project notes
      - name: Sync Jazz and auth settings
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const token = process.env.VERCEL_TOKEN;
          if (!token) {
            console.error("Add the VERCEL_TOKEN repository secret (Vercel account, Tokens).");
            process.exit(1);
          }
          const { projectId, orgId } = JSON.parse(readFileSync(".vercel/project.json", "utf8"));
          const targets = process.env.GITHUB_REF === "refs/heads/main"
            ? ["production", "preview"]
            : ["preview"];
          const specs = [
            ["VITE_JAZZ_APP_ID", "encrypted"],
            ["VITE_JAZZ_SERVER_URL", "encrypted"],
            ["JAZZ_ADMIN_SECRET", "sensitive"],
            ["BACKEND_SECRET", "sensitive"],
            ["BETTER_AUTH_SECRET", "sensitive"],
          ];
          for (const [key, type] of specs) {
            const value = process.env[key];
            if (!value) {
              console.error(`Missing GitHub secret ${key}`);
              process.exit(1);
            }
            for (const target of targets) {
              const response = await fetch(
                `https://api.vercel.com/v10/projects/${projectId}/env?upsert=true&teamId=${orgId}`,
                {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${token}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({ key, value, type, target: [target] }),
                },
              );
              if (!response.ok) {
                const payload = await response.json().catch(() => ({}));
                const detail = payload?.error?.message || payload?.error?.code || response.statusText;
                console.error(`Failed to sync ${key} to ${target}: ${response.status} ${detail}`);
                process.exit(1);
              }
              await response.body?.cancel();
              console.log(`synced ${key} to ${target}`);
            }
          }
          EOF
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          vercel pull --yes --non-interactive --environment=production
          vercel build --prod --yes --standalone
          vercel deploy --prebuilt --prod --yes
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: |
          vercel pull --yes --non-interactive --environment=preview
          vercel build --yes --standalone
          vercel deploy --prebuilt --yes
